name: Create Permanent NOVA Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Permanent Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NOVA VOICE AI,O=NOVA,C=IN"

      - name: Show SHA Fingerprints
        run: |
          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'SHA1:|SHA256:'

      - name: Generate Base64 File
        run: |
          base64 -w 0 debug.keystore > keystore-base64.txt

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Permanent-Keystore
          path: |
            debug.keystore
            keystore-base64.txt
          retention-days: 1
          
